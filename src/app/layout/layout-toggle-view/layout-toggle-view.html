<div class="w-full px-4 py-4 md:px-8">
  <div class="flex flex-col md:flex-row items-center justify-between gap-6 w-full max-w-full mx-auto">

    <div class="flex items-center gap-3 self-start md:self-center">
      <img src="/logo-gp.png" alt="Guardião de Pegadas" class="w-12 sm:w-16 h-auto" />
      <h1 class="text-xl md:text-2xl text-purple-800 font-bold whitespace-nowrap">
        Guardião de Pegadas
      </h1>
    </div>

    <div class="flex items-center gap-4 md:gap-8 w-full md:w-auto justify-between md:justify-end">

      <app-input-segmented-control [options]="['Pets', 'Tutores']" [value]="isSelected"
        (valueChange)="onValueChange($event)">
      </app-input-segmented-control>

      <button (click)="logout()"
        class="flex items-center gap-2 px-3 py-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all font-medium">
        <mat-icon class="text-md h-5 w-5">logout</mat-icon>
        <span class="hidden sm:inline">Sair</span>
      </button>
    </div>

  </div>

  <hr class="my-6 border-purple-100">

  <div class="w-full max-w-7xl mx-auto px-4">
    <ng-content></ng-content>
  </div>
</div>
