<div class="w-full p-4 md:p-4">
  <div class="flex flex-col md:flex-row items-center justify-between gap-6 w-full max-w-7xl mx-auto">

    <div class="flex items-center gap-4">
      <mat-icon fontIcon="pets" class="text-purple-800 scale-150"></mat-icon>
      <h1 class="text-2xl md:text-3xl text-purple-800 font-bold whitespace-nowrap">
        Guardião de Pegadas
      </h1>
    </div>

    <div class="w-full md:w-auto flex justify-center">
      <app-input-segmented-control [options]="['Pets', 'Tutores']" [(value)]="isSelected">
      </app-input-segmented-control>
    </div>

  </div>

  <hr class="my-6 border-purple-100">

  <div class="w-full max-w-7xl mx-auto">
    <ng-content></ng-content>
  </div>
</div>
