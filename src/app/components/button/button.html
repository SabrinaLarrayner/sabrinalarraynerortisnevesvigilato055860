<button type="button" (click)="handlePress()" [disabled]="disabled" [ngClass]="{
    'bg-purple-600 text-white hover:bg-purple-700 cursor-pointer shadow-sm':
      variant === 'primary' && !disabled,
    'bg-gray-300 text-gray-500 cursor-not-allowed shadow-none':
      variant === 'primary' && disabled,
    'border-2 border-purple-600 text-purple-600 hover:bg-purple-50 cursor-pointer shadow-sm':
      variant === 'outline' && !disabled,

    'border-2 border-gray-300 text-gray-400 cursor-not-allowed shadow-none':
      variant === 'outline' && disabled
  }" class="
    flex items-center justify-center gap-2
    px-6 py-2.5
    rounded-full
    font-semibold
    transition-all duration-200
    active:scale-95
    disabled:scale-100
    h-fit w-full
  ">
  <span>{{ label }}</span>

  @if (showIcon) {
  <mat-icon [ngClass]="
        disabled
          ? 'text-gray-400'
          : variant === 'primary'
            ? 'text-white'
            : 'text-purple-600'
      ">
    {{ iconName }}
  </mat-icon>
  }
</button>
