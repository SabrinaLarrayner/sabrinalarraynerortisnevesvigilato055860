<mat-form-field appearance="outline" class="w-full" color="primary">
  <mat-label>{{ label }}</mat-label>
  
  @if (icon) {
    <mat-icon matPrefix class="mr-2">{{ icon }}</mat-icon>
  }

  <input 
    matInput 
    [type]="type" 
    [placeholder]="placeholder" 
    [formControl]="control"
    (focus)="focus.emit()" 
    (blur)="blur.emit()"
  />
</mat-form-field>
