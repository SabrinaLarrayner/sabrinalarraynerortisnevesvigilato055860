<div class="flex flex-col gap-6 max-w-4xl mx-auto py-8 px-4">
  <button (click)="back()" class="flex items-center gap-2 text-gray-500 hover:text-purple-600 transition-colors w-fit">
    <mat-icon fontIcon="arrow_back" class="text-sm"></mat-icon>
    <span class="font-medium">Cancelar e voltar</span>
  </button>
  @if (loading) {
    <div class="flex flex-col items-center justify-center py-20 gap-4">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
      <p class="text-purple-600 font-medium">Processando...</p>
    </div>
  } @else {
    <app-card>
      <form [formGroup]="editForm" (ngSubmit)="save()" class="flex flex-col">
        <div class="relative h-64 w-full bg-purple-500 rounded-t-3xl overflow-hidden flex items-center justify-center">
          <input type="file" #fileInput class="hidden" accept="image/*" (change)="onFileSelected($event)">
          @if (fotoUrl) {
            <img [src]="fotoUrl" class="w-full h-full object-cover opacity-60">
          } @else {
            <mat-icon fontIcon="pets" class="text-white/30 text-8xl h-24 w-24"></mat-icon>
          }
          <div class="absolute inset-0 bg-black/20"></div>
          <div class="absolute top-4 right-4 flex gap-2">
            <app-button label="Trocar imagem" variant="primary" (click)="triggerFileInput(fileInput, $event)"></app-button>
            @if (fotoUrl) {
              <app-button label="Excluir imagem" variant="primary" (click)="openDeleteImgModal($event)"></app-button>
            }
          </div>
          <h2 class="absolute bottom-6 left-8 text-white text-2xl font-black">Editando Perfil</h2>
        </div>
        <div class="p-8 flex flex-col gap-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-input-field label="Nome do Pet" [control]="$any(editForm.get('nome'))"></app-input-field>
            <app-input-field label="Raça" [control]="$any(editForm.get('raca'))"></app-input-field>
            <app-input-field label="Idade (Anos)" type="number" [control]="$any(editForm.get('idade'))"></app-input-field>
          </div>
          <div class="pt-6 border-t border-gray-100 flex justify-end">
            <app-button label="Confirmar Atualização" variant="primary" class="w-full md:w-auto"></app-button>
          </div>
        </div>
      </form>
    </app-card>
  }
</div>
@if (showDeleteImgModal) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="closeDeleteImgModal()"></div>
  <div class="relative bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl flex flex-col gap-6 animate-in fade-in zoom-in duration-200 text-center">
    <div class="mx-auto text-red-500 p-4 rounded-full w-fit bg-red-50">
      <mat-icon fontIcon="image_not_supported" class="text-4xl h-10 w-10"></mat-icon>
    </div>
    <h2 class="text-2xl font-black text-purple-900">Remover Imagem?</h2>
    <p class="text-gray-500">Deseja realmente excluir a foto de <b>{{ editForm.get('nome')?.value }}</b>?</p>
    <div class="flex flex-col gap-3">
      <app-button (click)="confirmDeleteImage()" label="Sim, remover" class="w-full text-white"></app-button>
      <app-button (click)="closeDeleteImgModal()" label="Cancelar" variant="outline" class="w-full"></app-button>
    </div>
  </div>
</div>
}
