<div
  class="min-h-screen flex items-start pt-20 sm:pt-0 sm:items-center justify-center bg-gray-100 overflow-hidden px-4">
  <div class="relative w-full max-w-md mx-auto">

    <div
      class="absolute -top-20 sm:-top-24 left-1/2 -translate-x-1/2 w-full flex justify-center pointer-events-none z-0">
      <img src="/dog-1.png" alt="Cachorro olhando"
        class="w-28 sm:w-36 h-auto transition-all duration-500 ease-out transform"
        [class.translate-y-24]="!isLoginFocused" [class.opacity-0]="!isLoginFocused"
        [class.translate-y-0]="isLoginFocused" [class.opacity-100]="isLoginFocused" />

      <img src="/dog-2.png" alt="Tampando o olho"
        class="w-28 sm:w-36 h-auto absolute transition-all duration-500 ease-out transform"
        [class.translate-y-24]="!isSenhaFocada" [class.opacity-0]="!isSenhaFocada" [class.translate-y-0]="isSenhaFocada"
        [class.opacity-100]="isSenhaFocada" />
    </div>

    <app-card class="relative z-10 w-full block shadow-2xl rounded-3xl overflow-hidden">
      <div class="flex flex-col items-center gap-4 sm:gap-6 p-4 sm:p-6 bg-white">

        <div class="flex justify-center">
          <img src="/logo-gp.png" alt="Guardião de Pegadas" class="w-24 sm:w-32 h-auto" />
        </div>

        <div class="flex flex-col gap-1 sm:gap-2 text-center">
          <h1 class="text-2xl sm:text-3xl font-black text-purple-900 tracking-tight">
            Guardião de Pegadas
          </h1>
          <p class="text-gray-500 text-xs sm:text-sm">Entre para cuidar dos seus amigos</p>
        </div>

        <div class="w-full flex flex-col gap-3 sm:gap-4">
          <app-input-field label="Login" icon="person" [control]="loginForm.controls.username"
            (focus)="setLoginFocus(true)" (blur)="setLoginFocus(false)">
          </app-input-field>

          <app-input-field label="Senha" icon="lock" type="password" [control]="loginForm.controls.password"
            (focus)="setSenhaFocus(true)" (blur)="setSenhaFocus(false)">
          </app-input-field>
        </div>

        <div class="w-full mt-2 sm:mt-4">
          <app-button label="Entrar" variant="primary" class="w-full py-3 text-base sm:text-lg font-bold"
            (click)="onSubmit()" [disabled]="loginForm.invalid">
          </app-button>
        </div>

      </div>
    </app-card>
  </div>
</div>
