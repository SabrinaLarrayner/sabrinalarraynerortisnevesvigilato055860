<div class="flex items-center justify-center min-h-screen bg-gray-50 py-12 px-4">
  <div class="w-full max-w-xl">
    <app-card>
      <div class="flex flex-col gap-8">

        <div class="flex flex-col items-center gap-4">
          <div (click)="fileInput.click()"
            class="relative w-32 h-32 bg-purple-50 rounded-3xl flex items-center justify-center border-2 border-dashed border-purple-200 overflow-hidden cursor-pointer hover:bg-purple-100 transition-colors">

            @if (photoPreview) {
            <img [src]="photoPreview" class="w-full h-full object-cover">
            } @else {
            <mat-icon fontIcon="photo_camera" class="text-purple-300 text-4xl h-10 w-10"></mat-icon>
            }
            <input #fileInput type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
          </div>

          @if (photoPreview) {
          <div class="flex gap-3">
            <app-button label="Trocar" variant="outline" class="w-28" (click)="fileInput.click()">
            </app-button>
            <app-button label="Excluir" variant="outline" class="w-28" (click)="removePhoto()">
            </app-button>
          </div>
          }
        </div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
          <app-input-field label="Nome" placeholder="Nome do pet" [control]="nomeControl">
          </app-input-field>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-input-field [label]="yearsPlural()" type="number" min="0" [control]="idadeControl">
            </app-input-field>
            <app-input-field label="Raça" placeholder="Raça do pet" [control]="racaControl">
            </app-input-field>
          </div>
          <div class="flex flex-col md:flex-row gap-4 pt-4">
            <app-button label="Cancelar" variant="outline" class="flex-1" (click)="cancelar()">
            </app-button>
            <app-button label="Cadastrar Pet" class="flex-1" [disabled]="form.invalid">
            </app-button>
          </div>
        </form>
      </div>
    </app-card>
  </div>
</div>
