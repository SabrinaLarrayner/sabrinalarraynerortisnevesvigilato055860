<app-layout-toggle-view></app-layout-toggle-view>
<div class="flex flex-col gap-8 w-full py-6">
  <div class="flex flex-col-reverse md:flex-row items-center justify-center gap-4 max-w-2xl mx-auto w-full px-4">
    <div class="w-full md:flex-1">
      <app-input-field label="Buscar por nome..." icon="search" subscriptSizing="dynamic">
      </app-input-field>
    </div>

    <div class="w-full -mt-5 md:w-auto">
      <app-button label="Adicionar Pets" [showIcon]="true" iconName="add" class="w-full">
      </app-button>
    </div>
  </div>
  <div class="flex flex-row items-end justify-between w-full max-w-6xl mx-auto px-4">
    <div class="flex flex-col">
      <h1 class="text-purple-800 font-bold text-2xl leading-none">Pets</h1>
      <span class="text-gray-500 text-sm">12 Pets encontrados</span>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto px-4 w-full">
    
    <app-card>
      <div class="flex flex-col gap-6 p-2"> <div class="w-full h-72 bg-purple-50 rounded-3xl overflow-hidden shadow-inner">
          <img 
            src="https://img.freepik.com/fotos-gratis/adoravel-cachorrinho-rodeado-de-coracoes_23-2148460978.jpg?semt=ais_user_personalization&w=740&q=80" 
            alt="Foto do Pet"
            class="w-full h-full object-cover"
          />
        </div>

        <div class="flex flex-col gap-2 text-purple-900 px-2">
          <h2 class="text-2xl font-black">Julios</h2> <p class="text-gray-600 font-medium">Raça: SRD</p>
        </div>

        <div class="px-2 pb-2">
          <app-button label="Detalhes" variant="outline" class="w-full"></app-button>
        </div>
      </div>
    </app-card>

  </div>
</div>
