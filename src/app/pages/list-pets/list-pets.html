<app-layout-toggle-view></app-layout-toggle-view>

<div class="flex flex-col gap-8 w-full py-6">
  <div class="flex flex-col-reverse md:flex-row items-center justify-center gap-4 max-w-2xl mx-auto w-full px-4">
    <div class="w-full md:flex-1">
      <app-input-field label="Buscar por nome..." icon="search" subscriptSizing="dynamic" [control]="searchControl">
      </app-input-field>
    </div>
    <div class="w-full -mt-5 md:w-auto">
      <app-button label="Adicionar Pets" [showIcon]="true" iconName="add" class="w-full" (click)="navigateToCreate()"></app-button>
    </div>
  </div>

  <div class="flex flex-row items-end justify-between w-full max-w-screen-2xl mx-auto px-4">
    <div class="flex flex-col">
      <h1 class="text-purple-800 font-bold text-2xl leading-none">Pets</h1>
      <span class="text-gray-500 text-sm">{{ totalPets }} Pets encontrados</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6 max-w-screen-2xl mx-auto px-4 w-full">
    @for (pet of pets; track pet?.id) {
    <app-card>
      <div class="flex flex-col gap-4 p-2">
        <div class="w-full h-48 bg-purple-50 rounded-2xl overflow-hidden shadow-inner">
          <img [src]="pet.foto?.url || 'https://via.placeholder.com/400x300?text=Sem+Foto'" [alt]="pet.nome"
            class="w-full h-full object-cover" />
        </div>

        <div class="flex flex-col gap-1 text-purple-900 px-1">
          <h2 class="text-lg font-black truncate">{{ pet.nome }}</h2>
          <p class="text-gray-600 text-sm font-medium truncate">Raça: {{ pet.raca }}</p>
          <p class="text-gray-400 text-xs">Idade: {{ pet.idade }} anos</p>
        </div>

        <div class="flex flex-col gap-4">
          <app-button 
          label="Detalhes" 
          variant="outline" 
          class="w-full"
          (click)="detailsPet(pet.id)">
        </app-button>        </div>
      </div>
    </app-card>
    } @empty {
    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
      <mat-icon class="text-6xl h-16 w-16 mb-4">pets</mat-icon>
      <p>Nenhum pet encontrado.</p>
    </div>
    }
  </div>

  <div class="max-w-screen-2xl mx-auto w-full px-4 mb-10">
    <mat-paginator [length]="totalPets" [pageSize]="pageSize" [pageIndex]="currentPage" [pageSizeOptions]="[5, 10, 20]"
      (page)="handlePageEvent($event)" class="rounded-2xl border border-gray-100 shadow-sm">
    </mat-paginator>
  </div>
</div>
