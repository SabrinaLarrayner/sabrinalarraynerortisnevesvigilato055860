<div class="min-h-screen flex flex-col relative">

  <div class="fixed bottom-4 right-4 z-50 flex items-center gap-2 px-3 py-1.5 bg-white/80 backdrop-blur-md rounded-full shadow-lg border border-gray-100">
    <div [class]="(authFacade.apiOnline$ | async) ? 'bg-green-500 shadow-green-200' : 'bg-red-500 shadow-red-200'" 
         class="h-2.5 w-2.5 rounded-full shadow-[0_0_8px_rgba(0,0,0,0.1)] animate-pulse">
    </div>
    <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">
      {{ (authFacade.apiOnline$ | async) ? 'API Online' : 'API Offline' }}
    </span>
  </div>

  <main class="flex-1">
    <router-outlet />
  </main>

</div>
