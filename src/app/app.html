<div class="min-h-screen flex flex-col relative bg-gray-50/50">
  <div class="fixed bottom-6 left-6 z-50 flex items-center gap-3 px-4 py-2 
              bg-white/70 backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.08)] 
              border border-white/40 transition-all duration-500 hover:scale-105 group">
    
    <div class="relative flex h-3 w-3">
      <span [class]="(authFacade.apiOnline$ | async) ? 'bg-green-400' : 'bg-red-400'"
        class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75">
      </span>
      <span [class]="(authFacade.apiOnline$ | async) ? 'bg-green-500' : 'bg-red-500'"
        class="relative inline-flex rounded-full h-3 w-3 shadow-[0_0_12px_rgba(34,197,94,0.4)]">
      </span>
    </div>

    <div class="flex flex-col leading-tight">
      <span class="text-[11px] font-bold text-gray-700 uppercase tracking-tighter">
        Sistemas
      </span>
      <span [class]="(authFacade.apiOnline$ | async) ? 'text-green-600' : 'text-red-600'"
        class="text-[10px] font-medium transition-colors duration-300">
        {{ (authFacade.apiOnline$ | async) ? 'Operacional' : 'Instabilidade Detectada' }}
      </span>
    </div>

    <div class="absolute -top-10 left-0 bg-gray-900 text-white text-[10px] px-2 py-1 rounded 
                opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg">
      Atualizado em tempo real
    </div>
  </div>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
